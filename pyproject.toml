[project]
name = "aa-opencode"
version = "0.1.0"
description = "Compare the models offered by OpenCode against Artificial Analysis benchmarks (intelligence, speed, price)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pablo Caro" }]
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
]

[project.scripts]
aa-opencode = "aa_opencode.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aa_opencode"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ty.environment]
python-version = "3.10"
